schema_version: "1.0.0"
categories:
  dataset_user_input: Experiment or file metadata entered, selected, or imported by the user.
  dataset_user_mapping: Explicit relationship between user data and analytical roles or input columns.
  profile_locked_scientific: Scientifically consequential value immutable within a validated profile.
  profile_overridable_scientific: Scientifically consequential value that may change only by confirmed creation of a custom non-reference profile.
  derived: Computed from registered inputs; not manually hard-coded.
  application_internal: Software behavior without scientific interpretation; normally hidden.
  display_only: Presentation label with no analytical meaning.
  provenance_only: Immutable historical or traceability fact.
fields:
  project_id: {classification: derived, required: true, source: application, data_type: string, validation: unique stable identifier, default: generated, user_editable: false, user_mappable: false, affects_scientific_results: false, creates_custom_profile: false, provenance: required, future_ui: hidden}
  dataset_id: {classification: derived, required: true, source: application, data_type: string, validation: unique within project, default: generated, user_editable: false, user_mappable: false, affects_scientific_results: false, creates_custom_profile: false, provenance: required, future_ui: hidden}
  dataset_name: {classification: dataset_user_input, required: true, source: user, data_type: string, validation: non-empty, default: none, user_editable: true, user_mappable: false, affects_scientific_results: false, creates_custom_profile: false, provenance: required, future_ui: text}
  sample_id: {classification: dataset_user_input, required: true, source: user_or_import, data_type: string, validation: non-empty and unique within dataset, default: none, user_editable: true, user_mappable: true, affects_scientific_results: false, creates_custom_profile: false, provenance: required, future_ui: editable_table}
  condition_id: {classification: dataset_user_input, required: true, source: user_or_import, data_type: string, validation: non-empty and unique within dataset, default: none, user_editable: true, user_mappable: true, affects_scientific_results: true, creates_custom_profile: false, provenance: required, future_ui: dynamic_condition_panel}
  condition_label: {classification: display_only, required: true, source: user, data_type: string, validation: non-empty, default: condition_id, user_editable: true, user_mappable: false, affects_scientific_results: false, creates_custom_profile: false, provenance: required, future_ui: text}
  replicate_id: {classification: dataset_user_mapping, required: true, source: user_or_import, data_type: string, validation: non-empty and unique within condition when required by profile, default: none, user_editable: true, user_mappable: true, affects_scientific_results: true, creates_custom_profile: false, provenance: required, future_ui: dynamic_replicate_row}
  comparison: {classification: dataset_user_mapping, required: true, source: user, data_type: repeatable object, validation: references existing distinct conditions, default: none, user_editable: true, user_mappable: true, affects_scientific_results: true, creates_custom_profile: false, provenance: required, future_ui: comparison_builder}
  exposure_label: {classification: dataset_user_input, required: true, source: user_or_import, data_type: string, validation: non-empty plus profile compatibility, default: none, user_editable: true, user_mappable: true, affects_scientific_results: potentially, creates_custom_profile: false, provenance: required, future_ui: text_or_select}
  ion_mode: {classification: dataset_user_input, required: true, source: user_or_import, data_type: enum_POS_NEG, validation: controlled technical code, default: none, user_editable: true, user_mappable: true, affects_scientific_results: true, creates_custom_profile: false, provenance: required, future_ui: select}
  matrix: {classification: dataset_user_input, required: false, source: user_or_acquisition_metadata, data_type: string, validation: non-empty if supplied plus profile compatibility, default: none, user_editable: true, user_mappable: true, affects_scientific_results: acquisition_context, creates_custom_profile: false, provenance: required, future_ui: text_or_select}
  pixel_size_um: {classification: dataset_user_input, required: false, source: user_or_derived_metadata, data_type: positive_number, validation: positive plus profile compatibility, default: derive_when_possible, user_editable: true, user_mappable: false, affects_scientific_results: acquisition_context, creates_custom_profile: false, provenance: required, future_ui: numeric}
  declared_coordinate_count: {classification: dataset_user_input, required: false, source: user_or_import, data_type: positive_integer, validation: positive plus profile compatibility, default: none, user_editable: true, user_mappable: false, affects_scientific_results: validation_context, creates_custom_profile: false, provenance: required, future_ui: integer}
  observed_coordinate_count: {classification: derived, required: false, source: registered_imzML, data_type: positive_integer, validation: computed not edited, default: derive_at_validation, user_editable: false, user_mappable: false, affects_scientific_results: validation_context, creates_custom_profile: false, provenance: required, future_ui: read_only}
  image_dimensions: {classification: derived, required: false, source: registered_imzML_or_user_if_unavailable, data_type: object, validation: positive dimensions, default: derive_when_possible, user_editable: conditionally, user_mappable: false, affects_scientific_results: acquisition_context, creates_custom_profile: false, provenance: required, future_ui: numeric_pair}
  column_mappings: {classification: dataset_user_mapping, required: true, source: user_or_detected_with_confirmation, data_type: object, validation: required analytical roles resolve to unique columns, default: detect_without_silent_acceptance, user_editable: true, user_mappable: true, affects_scientific_results: true, creates_custom_profile: false, provenance: required, future_ui: column_mapper}
  mz_tolerance: {classification: profile_locked_scientific, required: true, source: scientific_profile, data_type: object, validation: profile schema, default: selected_profile, user_editable: false, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_profile_value}
  centroid_selection_rule: {classification: profile_locked_scientific, required: true, source: scientific_profile, data_type: enum_or_rule_id, validation: supported adapter, default: selected_profile, user_editable: false, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_profile_value}
  normalization_method: {classification: profile_locked_scientific, required: true, source: scientific_profile, data_type: rule_id, validation: spectrum_sum for PVL reference, default: selected_profile, user_editable: false, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_profile_value}
  normalization_scale: {classification: profile_overridable_scientific, required: true, source: scientific_profile, data_type: positive_number, validation: explicit custom profile required for change, default: selected_profile, user_editable: custom_profile_only, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_with_override_workflow}
  detection_thresholds: {classification: profile_overridable_scientific, required: true, source: scientific_profile, data_type: object, validation: explicit custom profile required for change, default: selected_profile, user_editable: custom_profile_only, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_with_override_workflow}
  replicate_support_rule: {classification: profile_overridable_scientific, required: true, source: scientific_profile, data_type: object, validation: explicit custom profile required for change, default: selected_profile, user_editable: custom_profile_only, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_with_override_workflow}
  readout_formulas: {classification: profile_locked_scientific, required: true, source: scientific_profile, data_type: object, validation: immutable for validated reference, default: selected_profile, user_editable: false, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_profile_value}
  missing_value_policy: {classification: profile_locked_scientific, required: true, source: scientific_profile, data_type: object, validation: immutable for validated reference, default: selected_profile, user_editable: false, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_profile_value}
  annotation_score_threshold: {classification: profile_overridable_scientific, required: true, source: scientific_profile, data_type: number, validation: explicit custom profile required for change, default: selected_profile, user_editable: custom_profile_only, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_with_override_workflow}
  artifact_retention: {classification: application_internal, required: false, source: user_preference, data_type: object, validation: supported retention choices, default: application_default, user_editable: true, user_mappable: false, affects_scientific_results: false, creates_custom_profile: false, provenance: required, future_ui: checkboxes}
  raw_data_root: {classification: dataset_user_input, required: true, source: user, data_type: path, validation: accessible external or project path, default: none, user_editable: true, user_mappable: false, affects_scientific_results: true, creates_custom_profile: false, provenance: path_and_hashes, future_ui: folder_picker}
  raw_data_pairs: {classification: dataset_user_mapping, required: true, source: user_or_discovery_with_confirmation, data_type: repeatable object, validation: one imzML and matching IBD per included sample, default: none, user_editable: true, user_mappable: true, affects_scientific_results: true, creates_custom_profile: false, provenance: required, future_ui: file_pair_table}
  aligned_feature_list: {classification: dataset_user_input, required: true, source: user, data_type: file, validation: readable and mapped target m/z/feature ID columns, default: none, user_editable: true, user_mappable: false, affects_scientific_results: true, creates_custom_profile: false, provenance: path_and_hash, future_ui: file_picker}
  annotated_feature_list: {classification: dataset_user_input, required: false, source: user, data_type: file, validation: required before annotation integration, default: none, user_editable: true, user_mappable: false, affects_scientific_results: true, creates_custom_profile: false, provenance: path_and_hash, future_ui: file_picker}
  output_location: {classification: dataset_user_input, required: true, source: user, data_type: path, validation: writable and policy-compliant, default: project_analysis_root, user_editable: true, user_mappable: false, affects_scientific_results: false, creates_custom_profile: false, provenance: required, future_ui: folder_picker}
  file_naming_convention: {classification: dataset_user_mapping, required: false, source: user_or_discovery_with_confirmation, data_type: object, validation: must resolve uniquely or explicit files used, default: no_filename_inference, user_editable: true, user_mappable: true, affects_scientific_results: potentially, creates_custom_profile: false, provenance: required, future_ui: mapping_editor}
  pseudocount_policy: {classification: profile_locked_scientific, required: true, source: scientific_profile, data_type: rule_id, validation: no_pseudocount for PVL reference, default: selected_profile, user_editable: false, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_profile_value}
  imputation_policy: {classification: profile_locked_scientific, required: true, source: scientific_profile, data_type: rule_id, validation: no_imputation for PVL reference, default: selected_profile, user_editable: false, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_profile_value}
  statistical_testing_policy: {classification: profile_locked_scientific, required: true, source: scientific_profile, data_type: rule_id, validation: no_p_values for PVL reference, default: selected_profile, user_editable: false, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_profile_value}
  accepted_adduct_rules: {classification: profile_overridable_scientific, required: true, source: scientific_profile, data_type: ion_mode_keyed_array, validation: explicit custom profile required for change, default: selected_profile, user_editable: custom_profile_only, user_mappable: false, affects_scientific_results: true, creates_custom_profile: true, provenance: required, future_ui: locked_with_override_workflow}
  application_log_level: {classification: application_internal, required: false, source: application_or_user_preference, data_type: enum, validation: controlled log level, default: INFO, user_editable: advanced, user_mappable: false, affects_scientific_results: false, creates_custom_profile: false, provenance: optional, future_ui: advanced_select}
  display_label: {classification: display_only, required: false, source: user, data_type: string, validation: non-empty if supplied, default: underlying identifier, user_editable: true, user_mappable: false, affects_scientific_results: false, creates_custom_profile: false, provenance: optional, future_ui: text}
  scientific_script_hash: {classification: provenance_only, required: true, source: scientific_core_manifest, data_type: sha256, validation: exact frozen hash, default: selected_core, user_editable: false, user_mappable: false, affects_scientific_results: false, creates_custom_profile: false, provenance: required, future_ui: read_only}
