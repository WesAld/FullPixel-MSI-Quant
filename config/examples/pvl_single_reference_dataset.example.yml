  - {condition_id: TRT, condition_label: TRT, analytical_role: comparison, display_order: 2, is_reference: false}
samples:
  - {sample_id: CTRL_R1, condition_id: CTRL, replicate_id: R1, sample_order: 1, inclusion_status: included}
  - {sample_id: CTRL_R2, condition_id: CTRL, replicate_id: R2, sample_order: 2, inclusion_status: included}
  - {sample_id: CTRL_R3, condition_id: CTRL, replicate_id: R3, sample_order: 3, inclusion_status: included}
  - {sample_id: TRT_R1, condition_id: TRT, replicate_id: R1, sample_order: 4, inclusion_status: included}
  - {sample_id: TRT_R2, condition_id: TRT, replicate_id: R2, sample_order: 5, inclusion_status: included}
  - {sample_id: TRT_R3, condition_id: TRT, replicate_id: R3, sample_order: 6, inclusion_status: included}
comparisons:
  - {comparison_id: CTRL_vs_TRT, comparison_label: TRT versus CTRL, reference_condition_id: CTRL, comparison_condition_id: TRT, enabled: true, display_order: 1}
