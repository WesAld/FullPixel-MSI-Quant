name: Release integrity

on:
  push:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python validation dependencies
        run: python -m pip install -r requirements.txt pyyaml

      - name: Verify release package
        run: python tools/verify_release.py

      - name: Validate repository contracts
        run: python tools/validate_contracts.py
